worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    upstream sync_api {
        least_conn;
        server node-api-sync:3000;
    }

    upstream async_api {
        least_conn;
        server node-api-async:3000;
    }

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # Use 429 (Too Many Requests) for rate-limit rejections so they are
    # distinguishable from real 503 capacity failures.
    limit_req_status 429;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream="$upstream_addr"';

    access_log /dev/stdout main;

    server {
        listen 80 default_server;

        # Route /api/async/* to the async container
        location /api/async/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://async_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route everything else under /api/ to the sync container
        # This includes auth, favorites, and sync search
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://sync_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /favicon.ico {
            return 204;
        }

        location = /health {
            access_log off;
            return 200 "OK";
        }
    }
}