<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="E1: efficiency per worker">
<style>:root{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;--crit:#d03b3b}@media (prefers-color-scheme:dark){:root{--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767}}text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;fill:var(--ink2)}.title{font-size:15px;font-weight:600;fill:var(--ink)}.sub{fill:var(--muted)}.tick{fill:var(--muted);font-variant-numeric:tabular-nums}.val{fill:var(--ink);font-variant-numeric:tabular-nums}</style>
<rect width="760" height="420" fill="var(--surface)"/>
<text class="title" x="64" y="26">E1: efficiency per worker</text>
<text class="sub" x="64" y="44">Capacity / (workers × capacity of one worker)</text>
<line x1="64" x2="736" y1="370" y2="370" stroke="var(--axis)"/>
<text class="tick" x="56" y="374" text-anchor="end">0</text>
<line x1="64" x2="736" y1="293" y2="293" stroke="var(--grid)"/>
<text class="tick" x="56" y="297" text-anchor="end">50</text>
<line x1="64" x2="736" y1="216" y2="216" stroke="var(--grid)"/>
<text class="tick" x="56" y="220" text-anchor="end">100</text>
<line x1="64" x2="736" y1="139" y2="139" stroke="var(--grid)"/>
<text class="tick" x="56" y="143" text-anchor="end">150</text>
<line x1="64" x2="736" y1="62" y2="62" stroke="var(--grid)"/>
<text class="tick" x="56" y="66" text-anchor="end">200</text>
<text class="tick" x="64" y="388" text-anchor="middle">0</text>
<text class="tick" x="232" y="388" text-anchor="middle">5</text>
<text class="tick" x="400" y="388" text-anchor="middle">10</text>
<text class="tick" x="568" y="388" text-anchor="middle">15</text>
<text class="tick" x="736" y="388" text-anchor="middle">20</text>
<text x="400" y="410" text-anchor="middle">workers</text>
<text transform="translate(16 216) rotate(-90)" text-anchor="middle">efficiency (%)</text>
<circle cx="97.6" cy="216.0" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>efficiency: 100 at 1</title></circle>
<circle cx="131.2" cy="80.9" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>efficiency: 188 at 2</title></circle>
<circle cx="198.4" cy="96.1" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>efficiency: 178 at 4</title></circle>
<circle cx="332.8" cy="119.5" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>efficiency: 163 at 8</title></circle>
<circle cx="467.2" cy="151.2" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>efficiency: 142 at 12</title></circle>
<circle cx="601.6" cy="204.4" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>efficiency: 108 at 16</title></circle>
</svg>
